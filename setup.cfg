[flake8]
max-line-length = 80
# WPS421 print/input: prints are the REPL UI; logger introduction planned later
# W503 line break before binary operator: PEP 8 prefers this style
ignore = WPS421,W503
per-file-ignores =
    src/pelmeni/__init__.py:WPS410,WPS412
    src/pelmeni/domain/__init__.py:WPS410,WPS412
    src/pelmeni/context/__init__.py:WPS410,WPS412
    src/pelmeni/tools/__init__.py:WPS410,WPS412
    src/pelmeni/mcp/__init__.py:WPS410,WPS412
    src/pelmeni/providers/antigravity/__init__.py:WPS410,WPS412
    src/pelmeni/providers/antigravity/process.py:WPS214,WPS338,WPS204,WPS210,WPS231,WPS229,WPS336,WPS501,WPS505,WPS220
    src/pelmeni/providers/antigravity/provider.py:WPS231
    src/pelmeni/context/compactor.py:WPS231,WPS204
    src/pelmeni/loop.py:WPS231,WPS362,WPS478
    tests/*:WPS
