[project]
name = "pelmeni"
version = "0.1.0"
description = "Multi-agent coding system, no SDK"
authors = [
    { name = "Konstantin Kochetkov", email = "kochkons1@ya.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.scripts]
pelmeni = "pelmeni.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "ruff>=0.16.1",
    "wemake-python-styleguide>=1.7.1",
]

[tool.ruff]
# Target your specific Python version
target-version = "py314"
line-length = 80

[tool.ruff.lint]
# Select all rules to maximize enforcement
select = ["ALL"]
ignore = [
    "D100", "D104", # Missing docstrings in public modules/packages
    "D401",         # First line should be in imperative mood
    "COM812",       # Trait conflicts with the formatter
    "ISC001",       # Trait conflicts with the formatter
]

